name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build
        run: cmake -B build && cmake --build build

      - name: Package POSIX binary
        run: |
          mkdir -p pkg/include pkg/lib
          cp include/peertalk.h pkg/include/
          cp build/libpeertalk.a pkg/lib/
          cp LICENSE pkg/
          tar czf libpeertalk-posix-linux-x86_64.tar.gz -C pkg include lib LICENSE

      - name: Package SDK source
        run: |
          tar czf peertalk-sdk-source.tar.gz \
            include/peertalk.h \
            src/core/ \
            src/platform/ \
            CMakeLists.txt \
            LICENSE

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --oneline "$PREV_TAG"..HEAD^ | head -50)
          else
            NOTES=$(git log --oneline -20 HEAD^)
          fi
          {
            echo "notes<<ENDOFNOTES"
            echo "## What's in this release"
            echo ""
            echo "**Pre-built POSIX library** (\`libpeertalk-posix-linux-x86_64.tar.gz\`):"
            echo "- \`lib/libpeertalk.a\` — static library for Linux x86_64"
            echo "- \`include/peertalk.h\` — public header"
            echo ""
            echo "**SDK source** (\`peertalk-sdk-source.tar.gz\`):"
            echo "- Everything needed for \`add_subdirectory()\` or FetchContent in CMake"
            echo "- Build for any platform: POSIX, 68k MacTCP, PPC MacTCP, PPC OT"
            echo ""
            echo "## Changes since last release"
            echo ""
            echo "$NOTES"
            echo "ENDOFNOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          files: |
            libpeertalk-posix-linux-x86_64.tar.gz
            peertalk-sdk-source.tar.gz

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLOG_COMMIT: "9f512365ce09cf1eed592bd49b5d11307639456a"

jobs:
  build-posix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Clone and build clog
        run: |
          git clone https://github.com/matthewdeaves/clog.git "$HOME/clog"
          cd "$HOME/clog" && git checkout ${{ env.CLOG_COMMIT }}
          mkdir build && cd build
          cmake .. && make

      - name: Build peertalk
        run: |
          mkdir build && cd build
          cmake .. -DCLOG_DIR="$HOME/clog"
          make

      - name: Run tests
        run: |
          cd build
          # test_clog_minimal verifies clog integration
          # Other tests (test_fast, test_reliable, etc.) require network peers
          ./test_clog_minimal

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --error-exitcode=1 \
            --enable=warning,performance \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            -I include \
            -I src/core \
            src/

  # Cross-compilation using Retro68 container (includes MPW Interfaces)
  build-68k-mactcp:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matthewdeaves/retro68@sha256:2433db2d7e8da9256c443b6193bf5dbe81b20d5f3b42a916eee80b7a711d5c9c
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Clone and build clog for 68k
        run: |
          git clone https://github.com/matthewdeaves/clog.git /tmp/clog
          cd /tmp/clog && git checkout ${{ env.CLOG_COMMIT }}
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/m68k-apple-macos/cmake/retro68.toolchain.cmake
          make

      - name: Build peertalk for 68k (MacTCP)
        run: |
          mkdir build-68k && cd build-68k
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/m68k-apple-macos/cmake/retro68.toolchain.cmake \
            -DCLOG_DIR=/tmp/clog \
            -DCLOG_LIB_DIR=/tmp/clog/build \
            -DPT_PLATFORM=MACTCP
          make

  build-ppc-mactcp:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matthewdeaves/retro68@sha256:2433db2d7e8da9256c443b6193bf5dbe81b20d5f3b42a916eee80b7a711d5c9c
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Clone and build clog for PPC
        run: |
          git clone https://github.com/matthewdeaves/clog.git /tmp/clog
          cd /tmp/clog && git checkout ${{ env.CLOG_COMMIT }}
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/powerpc-apple-macos/cmake/retroppc.toolchain.cmake
          make

      - name: Build peertalk for PPC (MacTCP)
        run: |
          mkdir build-ppc && cd build-ppc
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/powerpc-apple-macos/cmake/retroppc.toolchain.cmake \
            -DCLOG_DIR=/tmp/clog \
            -DCLOG_LIB_DIR=/tmp/clog/build \
            -DPT_PLATFORM=MACTCP
          make

  build-ppc-ot:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matthewdeaves/retro68@sha256:2433db2d7e8da9256c443b6193bf5dbe81b20d5f3b42a916eee80b7a711d5c9c
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Clone and build clog for PPC
        run: |
          git clone https://github.com/matthewdeaves/clog.git /tmp/clog
          cd /tmp/clog && git checkout ${{ env.CLOG_COMMIT }}
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/powerpc-apple-macos/cmake/retroppc.toolchain.cmake
          make

      - name: Build peertalk for PPC (Open Transport)
        run: |
          mkdir build-ppc-ot && cd build-ppc-ot
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/powerpc-apple-macos/cmake/retroppc.toolchain.cmake \
            -DCLOG_DIR=/tmp/clog \
            -DCLOG_LIB_DIR=/tmp/clog/build \
            -DPT_PLATFORM=OT
          make
